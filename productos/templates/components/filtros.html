<!-- FILTROS PREMIUM FUNCIONALES -->
<section class="container my-5" data-aos="fade-up">
    <div class="filters-premium">
        <div class="filters-header">
            <i class="bi bi-funnel"></i>
            <h4>Filtrar productos</h4>
        </div>
        <form method="get" id="filtrosForm">
            <input type="hidden" name="busqueda" />
            <div class="row">
                <!-- FILTRO POR CATEGORÍAS -->
                <div class="col-md-4">
                    <div class="filter-item">
                        <button type="button" class="filter-toggle" data-bs-toggle="collapse"
                            data-bs-target="#categoriaFilter">
                            <i class="bi bi-tag"></i>
                            Categorías
                            <i class="bi bi-chevron-down ms-auto"></i>
                        </button>
                        <div class="collapse mt-3" id="categoriaFilter">
                            <select name="categoria" class="form-select form-select-sm">
                                <option value="">Todas las categorías</option>
                                {% for cat in categorias %}
                                <option value="{{cat.id_categoria}}">
                                    {{cat.nombre_categoria}}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <!-- FILTRO POR UBICACIÓN -->
                <div class="col-md-4">
                    <div class="filter-item">
                        <button type="button" class="filter-toggle" data-bs-toggle="collapse"
                            data-bs-target="#ubicacionFilter">
                            <i class="bi bi-geo-alt"></i>
                            Ubicación
                            <i class="bi bi-chevron-down ms-auto"></i>
                        </button>
                        <div class="collapse mt-3" id="ubicacionFilter">
                            <select name="ubicacion" class="form-select form-select-sm">
                                <option value="">Todas las ubicaciones</option>
                                {% for u in ubicaciones %}
                                <option value="{{u}}" {% if request.GET.ubicacion == u %}selected{% endif %}>
                                     {{u}}
                                </option>
                                {% endfor %}
                            </select>
                            
                        </div>
                    </div>
                </div>

                <!-- FILTRO POR PRECIO -->
                <div class="col-md-4">
                    <div class="filter-item">
                        <button type="button" class="filter-toggle" data-bs-toggle="collapse"
                            data-bs-target="#precioFilter">
                            <i class="bi bi-currency-dollar"></i>
                            Precio
                            <i class="bi bi-chevron-down ms-auto"></i>
                        </button>
                        <div class="collapse mt-3" id="precioFilter">
                            <div class="d-flex gap-2">
                                <input type="number" name="precioMin" class="form-control form-control-sm"
                                    placeholder="Min" min="0">
                                <input type="number" name="precioMax" class="form-control form-control-sm"
                                    placeholder="Max" min="0">
                            </div>
                            <div class="range-values mt-2">
                                <small>$1.000 - $50.000</small>
                            </div>
                        </div>
                    </div>
                </div>


            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div class="row mt-4">
                <div class="col-12 text-center">
                    <button type="submit" class="btn btn-success me-2">
                        <i class="bi bi-search me-1"></i>Aplicar Filtros
                    </button>
                    <a class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-clockwise me-1"></i>Limpiar Filtros
                    </a>
                </div>
            </div>
        </form>
    </div>

</section>
