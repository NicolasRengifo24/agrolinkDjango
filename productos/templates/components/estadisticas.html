<section class="container my-5" data-aos="fade-up">
    <div class="row text-center">
        <div class="col-md-3">
            <div class="p-4">
                <i class="bi bi-people display-4 text-success mb-3"></i>
                <h3 class="fw-bold">{{total_usuarios}}</h3>
                <p class="text-muted">Usuarios registrados</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="p-4">
                <i class="bi bi-box-seam display-4 text-success mb-3"></i>
                <h3 class="fw-bold">{{total_productos}}</h3>
                <p class="text-muted">Productos disponibles</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="p-4">
                <i class="bi bi-truck display-4 text-success mb-3"></i>
                <h3 class="fw-bold">{{ porcentaje_entregas }}%</h3>
                <p class="text-muted">Entregas exitosas ({{ total_entregados }})</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="p-4">
                <i class="bi bi-star-fill display-4 text-success mb-3"></i>
                <h3 class="fw-bold">{{ calificacion_promedio|floatformat:1 }}/5</h3>
                <p class="text-muted">Calificación promedio</p>
            </div>
        </div>
    </div>
</section>
