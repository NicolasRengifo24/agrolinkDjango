<style>
.comentario-box {
    border-radius: 10px;
    background: #f8f9fa;
    border: 1px solid #eee;
    transition: all 0.2s ease;
}

.comentario-box:hover {
    background: #f1f3f5;
    transform: translateY(-2px);
}

.comentario-usuario {
    font-weight: 600;
}

.comentario-estrellas {
    color: #ffc107;
    font-size: 14px;
}
</style>

<h4 class="mt-4">Opiniones de clientes</h4>

{% for c in comentarios %}
    <div class="comentario-box mb-3 p-3">

        <div class="d-flex justify-content-between align-items-center">
            <span class="comentario-usuario">
                {{ c.usuario }}
            </span>

            <span class="comentario-estrellas">
                ⭐ {{ c.puntaje }}
            </span>
        </div>

        <p class="mb-0 text-muted mt-2">
            {{ c.comentario }}
        </p>

    </div>
{% endfor %}

{% if not comentarios %}
    <p class="text-muted">Este producto aún no tiene comentarios.</p>
{% endif %}
