<div class="card-glass mb-4 p-4">

    <div class="row g-3">

        <div class="col-md-3">
            <select class="form-select" id="categoriaFilter">
                <option value="">Todas las categorías</option>
                {% for cat in categorias %}
                <option value="{{ cat.id_categoria }}">{{ cat.nombre_categoria }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-3">
            <select class="form-select" id="stockFilter">
                <option value="">Todos los stocks</option>
                <option value="disponible">Disponible</option>
                <option value="bajo">Bajo</option>
                <option value="agotado">Agotado</option>
            </select>
        </div>

        <div class="col-md-3">
            <input type="text" class="form-control" id="nombreFilter" placeholder="Buscar por nombre...">
        </div>

        <div class="col-md-3 text-end">
            <a href="{% url 'crear_producto_admin' %}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Agregar Producto
            </a>
        </div>

    </div>

</div>
