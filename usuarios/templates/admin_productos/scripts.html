<script>

function filtrar() {
    let cat = document.getElementById('categoriaFilter').value;
    let stock = document.getElementById('stockFilter').value;

    document.querySelectorAll('.producto-item').forEach(function(r) {
        let pasaCat = !cat || r.dataset.categoria === cat;

        let s = parseInt(r.dataset.stock);
        let pasaStock = !stock ||
            (stock === 'disponible' && s >= 10) ||
            (stock === 'bajo' && s > 0 && s < 10) ||
            (stock === 'agotado' && s === 0);

        r.style.display = (pasaCat && pasaStock) ? '' : 'none';
    });
}

document.getElementById('categoriaFilter')?.addEventListener('change', filtrar);
document.getElementById('stockFilter')?.addEventListener('change', filtrar);

</script>
