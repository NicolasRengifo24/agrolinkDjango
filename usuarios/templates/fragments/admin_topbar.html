<div class="d-flex justify-content-between align-items-center mb-4">

    <h4 class="fw-bold">Panel de Administración</h4>

    <div class="d-flex align-items-center gap-3">

        <!-- Notificaciones -->
        <a href="{% url 'listar_notificaciones' %}" class="position-relative text-decoration-none">
            <i class="bi bi-bell fs-5" style="color:var(--green);"></i>
            {% if notificaciones_no_leidas|default:0 > 0 %}
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:10px;">
                {{ notificaciones_no_leidas|default:0 }}
            </span>
            {% endif %}
        </a>

        <!-- Usuario -->
        <span class="text-muted">
            admin
        </span>

        <!-- Avatar -->
        <img src="https://ui-avatars.com/api/?name=Admin"
            class="rounded-circle"
            width="35"
            height="35">

    </div>

</div>
