{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Usuario | AgroLink</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h3 class="mb-4 text-success">
                Editar Usuario
        </h3>

        <!-- MENSAJES -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- FORMULARIO -->
        <form method="POST">
            {% csrf_token %}

            <div class="row g-3">

                <!-- NOMBRE -->
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="txt_nombre" class="form-control"
                        value="{{ usuario.nombre }}" required>
                </div>

                <!-- APELLIDO -->
                <div class="col-md-6">
                    <label class="form-label">Apellido</label>
                    <input type="text" name="txt_apellido" class="form-control"
                        value="{{ usuario.apellido }}" required>
                </div>

                <!-- USUARIO -->
                <div class="col-md-6">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control"
                        value="{{ usuario.nombre_usuario }}" disabled>
                </div>

                <!-- CORREO -->
                <div class="col-md-6">
                    <label class="form-label">Correo</label>
                    <input type="email" name="txt_correo" class="form-control"
                        value="{{ usuario.correo }}" required>
                </div>

                <!-- TELÉFONO -->
                <div class="col-md-6">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="txt_telefono" class="form-control"
                        value="{{ usuario.telefono }}">
                </div>

                <!-- CÉDULA -->
                <div class="col-md-6">
                    <label class="form-label">Cédula</label>
                    <input type="text" class="form-control"
                        value="{{ usuario.cedula }}" disabled>
                </div>

                <!-- CIUDAD -->
                <div class="col-md-6">
                    <label class="form-label">Ciudad</label>
                    <input type="text" name="txt_ciudad" class="form-control"
                        value="{{ usuario.ciudad }}">
                </div>

                <!-- DEPARTAMENTO -->
                <div class="col-md-6">
                    <label class="form-label">Departamento</label>
                    <input type="text" name="txt_departamento" class="form-control"
                        value="{{ usuario.departamento }}">
                </div>

                <!-- DIRECCIÓN -->
                <div class="col-md-12">
                    <label class="form-label">Dirección</label>
                    <input type="text" name="txt_direccion" class="form-control"
                        value="{{ usuario.direccion }}">
                </div>

                <!-- ROL (SOLO VISUAL) -->
                <div class="col-md-6">
                    <label class="form-label">Rol</label>
                    <input type="text" class="form-control"
                        value="{{ usuario.rol }}" disabled>
                </div>

            </div>

            <hr class="my-4">

            <!-- BOTONES -->
            <div class="d-flex justify-content-between">

                <a href="{% url 'ver_listas_usuarios_admin' %}" class="btn btn-secondary">
                    Volver
                </a>

                <button type="submit" class="btn btn-success">
                    Guardar cambios
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
