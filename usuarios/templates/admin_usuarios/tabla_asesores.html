<div class="tab-pane fade" id="asesores">

    <div class="table-responsive">
        <table class="table table-hover align-middle">

            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Especialidad</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaAsesores">

                {% for a in asesores %} 

                <!-- Asesor 1 -->
                <tr>
                    <td>#{{ a.id_usuario.id_usuario }}</td>
                    
                    <td>{{ a.id_usuario.nombre }}</td>
                    <td>{{ a.id_usuario.correo }}</td>
                    <td>{{ a.id_usuario.especialidad }}</td>
                    <td>
                        {% if a.id_usuario.estado %}
                            <span class="badge bg-success">Activo</span>
                        {% else %}
                            <span class="badge bg-danger">Inactivo</span>
                        {% endif %}
                    </td>
                    <td>
                        <a href="{% url 'ver_usuario' a.id_usuario.id_usuario %}" class="btn btn-info btn-sm">Ver</a>
                        <a href="{% url 'editar_usuario' a.id_usuario.id_usuario %}" class="btn btn-warning btn-sm">Editar</a>
                        <a href="{% url 'eliminar_usuario' a.id_usuario.id_usuario %}" class="btn btn-danger btn-sm">Eliminar</a>
                    </td>
                </tr>
                {% endfor %}

            </tbody>

        </table>
    </div>

</div>
