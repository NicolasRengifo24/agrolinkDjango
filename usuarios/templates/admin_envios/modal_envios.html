{% load static %}


<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />




<div class="modal fade" id="modalEnvio">
  <div class="modal-dialog modal-xl">
    <div class="modal-content p-4">

      <!-- HEADER -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5>
          Tracking del Envío #<span id="envioId"></span>
        </h5>
        <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">
          ✖
        </button>
      </div>

      <!-- MAPA -->
      <div id="mapaEnvio" style="height:400px; border-radius:12px;"></div>

      <!-- INFO DEL ENVÍO -->
      <div class="row mt-4">

        <div class="col-md-6">
          <p><strong>Estado:</strong> <span id="envioEstado"></span></p>
          <p><strong>N° Seguimiento:</strong> <span id="envioTracking"></span></p>
          <p><strong>Distancia:</strong> <span id="envioDistancia"></span> km</p>
          <p><strong>Peso total:</strong> <span id="envioPeso"></span> kg</p>
        </div>

        <div class="col-md-6">
          <p><strong>Fecha salida:</strong> <span id="envioSalida"></span></p>
          <p><strong>Fecha entrega:</strong> <span id="envioEntrega"></span></p>
          <p><strong>Transportista:</strong> <span id="envioTransportista"></span></p>
          <p><strong>Vehículo:</strong> <span id="envioVehiculo"></span></p>
        </div>

      </div>

      <!-- DIRECCIONES -->
      <div class="mt-3">
        <p><strong>Origen:</strong> <span id="envioOrigen"></span></p>
        <p><strong>Destino:</strong> <span id="envioDestino"></span></p>
      </div>

      <!-- COSTOS -->
      <div class="mt-3">
        <h6>Costos</h6>
        <p><strong>Costo base:</strong> $<span id="envioCostoBase"></span></p>
        <p><strong>Costo por peso:</strong> $<span id="envioCostoPeso"></span></p>
        <p><strong>Costo total:</strong> $<span id="envioCostoTotal"></span></p>
      </div>

      <!-- FOOTER -->
      <div class="text-end mt-3">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Cerrar
        </button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="{% static 'js/mapa_envios.js' %}"></script>
