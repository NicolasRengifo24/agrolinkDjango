{% load static %}
<div class="col-md-6">
    <div class="card shadow-sm border-0 hover-card">
        <div class="card-body">
            <!-- Modo visualización -->
            <div class="view-mode">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <h5 class="card-title fw-bold text-success mb-0">
                        <i class="bi bi-truck me-2"></i>{{ vehiculo.tipo }}
                    </h5>
                    <span class="badge {% if vehiculo.activo %}bg-success{% else %}bg-secondary{% endif %}">
                        {% if vehiculo.activo %}Activo{% else %}Suspendido{% endif %}
                    </span>
                </div>
                
                <div class="vehiculo-info mb-3">
                    <p class="mb-2">
                        <i class="bi bi-upc-scan me-2 text-muted"></i>
                        <strong>Placa:</strong> {{ vehiculo.placa }}
                    </p>
                    <p class="mb-2">
                        <i class="bi bi-speedometer2 me-2 text-muted"></i>
                        <strong>Capacidad:</strong> {{ vehiculo.capacidad }} kg
                    </p>
                    <p class="mb-2">
                        <i class="bi bi-calendar-check me-2 text-muted"></i>
                        <strong>Registro:</strong> {{ vehiculo.fecha_registro|date:"d/m/Y" }}
                    </p>
                </div>
                
                <div class="d-flex gap-2">
                    {% if vehiculo.activo %}
                        <button class="btn btn-warning btn-sm suspender-btn" data-id="{{ vehiculo.id }}">
                            <i class="bi bi-pause-circle me-1"></i>Suspender
                        </button>
                    {% else %}
                        <button class="btn btn-success btn-sm activar-btn" data-id="{{ vehiculo.id }}">
                            <i class="bi bi-play-circle me-1"></i>Activar
                        </button>
                    {% endif %}
                    <button class="btn btn-danger btn-sm eliminar-btn" data-id="{{ vehiculo.id }}">
                        <i class="bi bi-trash me-1"></i>Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .hover-card {
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .hover-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.12) !important;
    }
    .vehiculo-info i {
        width: 24px;
    }
</style>
