{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Envíos - Agrolink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/mis_envios.css'%}">
    <link rel="stylesheet" href="{% static 'css/envios.css'%}">

    <style>
        /* Eliminar espacios en blanco */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f8faf7;
            font-family: "Inter", sans-serif;
        }

        html {
            margin: 0;
            padding: 0;
        }

        /* Asegurar que el navbar esté pegado arriba */
        .navbar-custom {
            position: sticky;
            top: 0;
            z-index: 1000;
            margin: 0;
            padding: 0.1rem 0;
        }

        /* Modificar el main-content - eliminar margin-left */
        .main-content {
            margin-left: 0 !important;  /* ← Elimina el margen del sidebar */
            padding: 20px 30px;
            min-height: 100vh;
            max-width: 1200px;  /* Ancho máximo opcional */
            margin: 0 auto;      /* Centrar el contenido */
            width: 100%;
        }
        
        /* Ajustar el topbar y container-envios para que ocupen todo el ancho */
        .topbar {
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 30px;
            width: 100%;
        }
        
        .container-envios {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            width: 100%;
        }
        
        /* Asegurar que el navbar esté pegado arriba */
        .navbar-custom {
            position: sticky;
            top: 0;
            z-index: 1000;
            margin: 0;
            width: 100%;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                padding: 15px;
            }
            
            .topbar, .container-envios {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    {% include 'components/navbar_transportista.html' %}
    
    

    <!-- Incluir el sidebar de Django -->

    <main class="main-content">
        {% include "includes/toastify_messages.html" %}

        {%block content %}
        {% endblock %}
    </main>

    {% include 'components/footer.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


    <script>
        function verDetalle(envioId) {
            // Redirigir a la página de detalles del envío
            window.location.href = `/envios/detalle/${envioId}/`;
        }
    </script>
    

</body>

</html>
