<!-- 🔥 MODAL EDITAR SERVICIO -->
<div class="modal fade" id="editarModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title">
                    <i class="bi bi-pencil-square me-2"></i>Editar Servicio
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form method="POST" id="formEditar">
                {% csrf_token %}

                <div class="modal-body">

                    <!-- ID oculto -->
                    <input type="hidden" name="id_servicio" id="edit_id">

                    <!-- CATEGORIA -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Categoría</label>
                        <input type="text" name="categoria" id="edit_categoria" class="form-control" required>
                    </div>

                    <!-- DESCRIPCIÓN -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea name="descripcion" id="edit_descripcion" class="form-control" rows="3" required></textarea>
                    </div>

                    <!-- ESTADO -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Estado</label>
                        <select name="estado" id="edit_estado" class="form-select">
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-warning">
                        Guardar cambios
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
